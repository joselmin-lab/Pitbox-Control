plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.pitbox.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pitbox.control'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
